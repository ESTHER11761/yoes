
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOES | Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#171717}
header{background:#111;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900;letter-spacing:3px}
.logo span{color:#c7ff3d}
main{max-width:1050px;margin:35px auto;padding:0 18px}
.panel{background:white;padding:25px;border-radius:12px;margin-bottom:20px}
h2{margin-top:0}
input,button{padding:13px;border-radius:7px;font-size:15px}
input{width:100%;border:1px solid #ccc;margin:7px 0 15px}
button{border:0;background:#c7ff3d;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.logout{background:white;color:#111}
.hidden{display:none}
.message{margin-top:12px;color:#b00020}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
.table-wrap{overflow-x:auto}
.status{color:#168044;font-weight:bold}
</style>
</head>
<body>

<header>
  <div class="logo">YOES<span>.</span></div>
  <button id="logoutBtn" class="logout hidden">Cerrar sesión</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Acceso privado YOES</h2>
    <p>Ingresa con tu usuario administrador.</p>

    <form id="loginForm">
      <label>Correo electrónico</label>
      <input id="email" type="email" required
      placeholder="Tu correo">

      <label>Contraseña</label>
      <input id="password" type="password" required
      placeholder="Tu contraseña">

      <button type="submit">INGRESAR</button>
    </form>
    <p id="loginMessage" class="message"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="panel">
      <h2>Panel de administración</h2>
      <p class="status">Acceso autorizado: administrador YOES</p>
      <p>Desde aquí gestionaremos el catálogo de tu tienda.</p>
    </div>

    <div class="panel">
      <h2>Productos registrados</h2>
      <p id="productCount">Cargando...</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
            
    <th>Producto</th>
    <th>SKU</th>
    <th>Categoría</th>
    <th>Estado</th>
    <th>Acciones</th>
</tr>

          </thead>
          <tbody id="productsTable"></tbody>
        </table>
      </div>
      <p id="productsMessage"></p>
      <section class="admin-form">
  <h2>Registrar nuevo producto</h2>

  <form id="productForm">
    <label>Nombre del producto</label>
    <input type="text" id="productName" required
      placeholder="Ej. Polo Oversize">

    <label>Código SKU</label>
    <input type="text" id="productSku"
      placeholder="Ej. YOES-001">

    <label>Categoría</label>
    <select id="productCategory" required>
      <option value="">Seleccionar categoría</option>
      <option value="Hombre">Hombre</option>
      <option value="Mujer">Mujer</option>
      <option value="Unisex">Unisex</option>
    </select>

    <label>Descripción</label>
    <textarea id="productDescription"
      placeholder="Descripción del producto"></textarea>

    <label>URL de la fotografía</label>
    <input type="text" id="productImage"
      placeholder="images/producto-001.jpg">
<label>Talla</label>
<select id="productSize" required>
  <option value="">Seleccionar talla</option>    
  <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="UNITALLA">Unitalla</option>
    </select>

    <label>Color</label>
    <input type="text" id="productColor"
      placeholder="Ej. Negro" required>
<label>Costo de compra (S/)</label>
<input
  type="number"
  id="productCost"
  min="0"
  step="0.01"
  required
>

<label>Precio de venta (S/)</label>
<input
  type="number"
  id="productPrice"
  min="0"
  step="0.01"
  required
>
    <label>Stock</label>
    <input type="number" id="productStock"
      min="0" step="1" required>

    <button type="submit">Registrar producto</button>
  </form>

  <p id="formMessage"></p>
</section>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://eowqjlzfwbevrqhaewsk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_z3IsC0TNVzRtIYfItp5pTg_vY0SIV8u';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginPanel = document.getElementById('loginPanel');
const adminPanel = document.getElementById('adminPanel');
const logoutBtn = document.getElementById('logoutBtn');
const loginMessage = document.getElementById('loginMessage');

async function verificarAdministrador() {
  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) {
    mostrarLogin();
    return;
  }

  const { data, error } = await supabaseClient
    .from('admin_profiles')
    .select('role, display_name')
    .eq('user_id', session.user.id)
    .maybeSingle();

  if (error || !data || data.role !== 'admin') {
    await supabaseClient.auth.signOut();
    mostrarLogin();
    loginMessage.textContent =
      'Tu usuario no tiene permisos de administrador.';
    return;
  }

  loginPanel.classList.add('hidden');
  adminPanel.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');

  cargarProductos();
}

function mostrarLogin() {
  loginPanel.classList.remove('hidden');
  adminPanel.classList.add('hidden');
  logoutBtn.classList.add('hidden');
}

document.getElementById('loginForm')
.addEventListener('submit', async function(e) {
  e.preventDefault();
  loginMessage.textContent = 'Verificando acceso...';

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth
    .signInWithPassword({ email, password });

  if (error) {
    loginMessage.textContent = 'Error: ' + error.message;
    return;
  }

  await verificarAdministrador();
});

logoutBtn.addEventListener('click', async function() {
  await supabaseClient.auth.signOut();
  mostrarLogin();
});

async function cargarProductos() {
  const tabla = document.getElementById('productsTable');
  const mensaje = document.getElementById('productsMessage');

  tabla.innerHTML = '';
  mensaje.textContent = 'Consultando productos...';

  const { data, error } = await supabaseClient
    .from('products')
.select('id, name, sku, category, active')
    .order('created_at', { ascending: false });

  if (error) {
    mensaje.textContent = 'Error al cargar: ' + error.message;
    return;
  }

  document.getElementById('productCount').textContent =
    'Total de productos: ' + data.length;

  if (data.length === 0) {
    mensaje.textContent = 'Todavía no hay productos registrados.';
    return;
  }

  mensaje.textContent = '';

  
data.forEach(product => {
    const fila = document.createElement('tr');

    const nombre = document.createElement('td');
    nombre.textContent = product.name || '';

    const sku = document.createElement('td');
    sku.textContent = product.sku || '';

    const categoria = document.createElement('td');
    categoria.textContent = product.category || '';

    const estado = document.createElement('td');
    estado.textContent = product.active ? 'Activo' : 'Inactivo';

    const acciones = document.createElement('td');

    const botonEditar = document.createElement('button');
    botonEditar.textContent = 'Editar';
    botonEditar.type = 'button';
    botonEditar.onclick = () => editarProducto(product.id);

    acciones.appendChild(botonEditar);

    fila.append(nombre, sku, categoria, estado, acciones);
    tabla.appendChild(fila);
});

}
  // REGISTRAR PRODUCTOS EN SUPABASE

let productoEnEdicion = null;

async function editarProducto(id) {
  const mensaje = document.getElementById('formMessage');

  mensaje.textContent = 'Cargando producto...';

  const { data: producto, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    mensaje.textContent = 'Error: ' + error.message;
    return;
  }

  const { data: variantes, error: errorVariantes } = await supabaseClient
    .from('product_variants')
    .select('*')
    .eq('product_id', id)
    .limit(2);

  if (errorVariantes || !variantes || variantes.length !== 1) {
    mensaje.textContent =
      'No se pudo identificar una única variante para editar.';
    return;
  }

  const variante = variantes[0];

  productoEnEdicion = {
    productoId: id,
    varianteId: variante.id
  };

  document.getElementById('productName').value = producto.name || '';
  document.getElementById('productSku').value = producto.sku || '';
  document.getElementById('productCategory').value = producto.category || '';
  document.getElementById('productDescription').value = producto.description || '';
  document.getElementById('productImage').value = producto.image_url || '';

  document.getElementById('productSize').value = variante.size || '';
  document.getElementById('productColor').value = variante.color || '';
  document.getElementById('productStock').value = variante.stock ?? 0;
  document.getElementById('productCost').value = variante.cost ?? 0;
  document.getElementById('productPrice').value = variante.price ?? 0;

  const boton = document.querySelector('#productForm button[type="submit"]');
  boton.textContent = 'Guardar cambios';

  mensaje.textContent = 'Editando producto: ' + producto.name;

  document.getElementById('productForm').scrollIntoView({
    behavior: 'smooth'
  });
}

document.getElementById('productForm')
.addEventListener('submit', async function(e) {
  e.preventDefault();

  const mensaje = document.getElementById('formMessage');
  const boton = this.querySelector('button[type="submit"]');

  const nombre = document.getElementById('productName').value.trim();
  const sku = document.getElementById('productSku').value.trim();
  const categoria = document.getElementById('productCategory').value;
  const talla = document.getElementById('productSize').value;
  const color = document.getElementById('productColor').value.trim();
  const stock = Number(document.getElementById('productStock').value);
  const costo = Number(document.getElementById('productCost').value);
  const precio = Number(document.getElementById('productPrice').value);
  const descripcion = document.getElementById('productDescription').value.trim();
  const imagen = document.getElementById('productImage').value.trim();

  if (!nombre || !sku || !categoria || !talla || !color) {
    mensaje.textContent = 'Completa todos los campos obligatorios.';
    return;
  }

  if (
    !Number.isInteger(stock) || stock < 0 ||
    !Number.isFinite(costo) || costo < 0 ||
    !Number.isFinite(precio) || precio <= 0
  ) {
    mensaje.textContent = 'Revisa el stock, costo y precio.';
    return;
  }

  boton.disabled = true;
  boton.textContent = 'Guardando...';
  mensaje.textContent = '';

  try {
    if (productoEnEdicion) {
      // ACTUALIZAR PRODUCTO EXISTENTE
      const { error: errorProducto } = await supabaseClient
        .from('products')
        .update({
          name: nombre,
          sku: sku,
          category: categoria,
          description: descripcion || null,
          image_url: imagen || null
        })
        .eq('id', productoEnEdicion.productoId);

      if (errorProducto) throw errorProducto;

      // ACTUALIZAR SU VARIANTE
      const { error: errorVariante } = await supabaseClient
        .from('product_variants')
        .update({
          sku: sku,
          size: talla,
          color: color,
          cost: costo,
          price: precio,
          stock: stock,
          active: true
        })
        .eq('id', productoEnEdicion.varianteId);

      if (errorVariante) throw errorVariante;

      mensaje.textContent = '¡Producto actualizado correctamente!';
      productoEnEdicion = null;

    } else {
      // REGISTRAR PRODUCTO NUEVO
      const { data: producto, error: errorProducto } = await supabaseClient
        .from('products')
        .insert({
          name: nombre,
          sku: sku,
          category: categoria,
          description: descripcion || null,
          image_url: imagen || null,
          active: true
        })
        .select('id')
        .single();

      if (errorProducto) throw errorProducto;

      const { error: errorVariante } = await supabaseClient
        .from('product_variants')
        .insert({
          product_id: producto.id,
          sku: sku,
          size: talla,
          color: color,
          cost: costo,
          price: precio,
          stock: stock,
          active: true
        });

      if (errorVariante) {
        await supabaseClient
          .from('products')
          .delete()
          .eq('id', producto.id);

        throw errorVariante;
      }

      mensaje.textContent = '¡Producto registrado correctamente!';
    }

    this.reset();

    boton.textContent = 'Registrar producto';

    await cargarProductos();

  } catch (error) {
    console.error('Error:', error);
    mensaje.textContent = 'Error: ' + error.message;

  } finally {
    boton.disabled = false;
    if (!productoEnEdicion) {
      boton.textContent = 'Registrar producto';
    }
  }
});

  setTimeout(verificarAdministrador, 0);
});

verificarAdministrador();
</script>

</body>
</html>
